<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="site-wrapper">
    <div class="container">
      <main class="content">
        {{ content }}
      </main>
      <aside class="sidebar">
        <a href="/" class="back-home">回到首頁</a>
        <h3>文章分類</h3>
        <ul class="category-list">
          {% for category in site.categories %}
            <li>
              <a href="/categories/{{ category[0] }}/index.html">
                <span class="cat-name">{{ category[0] }}</span>
                <span class="cat-count">({{ category[1].size }})</span>
              </a>
            </li>
          {% endfor %}
        </ul>
      </aside>
    </div>
  </div>
</body>
</html>
